name: Build Hermes Desktop for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-desktop:
    name: Build Windows Desktop (NSIS)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install npm 12
        shell: pwsh
        run: npm install -g npm@12

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Build Windows NSIS desktop installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win:nsis

      - name: Show build output
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "apps/desktop/release") {
            Get-ChildItem -Path "apps/desktop/release" -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "apps/desktop/release does not exist"
          }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hermes-desktop-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14
